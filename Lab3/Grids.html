<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gride</title>
</head>

<style>
    .grid-container {
        display: grid;
        grid-template-columns: 20% 80%;
        grid-template-rows: 70px 530px 70px;
        gap: 10px;
        background-color: #9ec7e7;
        padding: 10px;
        box-sizing: border-box;
    }

    header {
        grid-row: 1/2;
        grid-column: 1 / 3;
        background-color: #2f5885;
        text-align: center;
        color: white;
        font-size: 24px;
        line-height: 70px;
    }

    aside {
        grid-row: 2 / 3;
        grid-column: 1 / 2;
        background-color: #d1e7f7;
        text-align: center;
        line-height: 530px;
        font-size: 24px;
    }
    
    content{
        grid-row: 2 / 3;
        grid-column: 2/ 2;
        background-color: #132a3a;
        text-align: center;
        color: white;
        line-height: 530px;
        font-size: 24px;

    }

    footer {
        grid-row: 3 / 4;
        grid-column: 1 / 3;
        background-color: #02070b;
        text-align: center;
        color: white;
        font-size: 24px;
        line-height: 70px;
    }
</style>
<body>
    <h2>Grid Layout Example</h2>
    <div class="grid-container">
        <header>Header</header>
        <aside>Aside</aside>
        <content>Main Content</content>
        <footer>Footer</footer>
    </div>
</body>
</html>
