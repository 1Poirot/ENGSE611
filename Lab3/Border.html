<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>border</title>
</head>
<style>
    .border-list{
        border : 2px solid rgb(25, 0, 74);
    }
    /* แบบ 1 : โค้งทุกมุมเท่ากัน*/
    .radius-20{
        border-radius: 20px;
    }
    /* แบบ 2 : วงรี (โค้งมาก)*/
    .radius-50{
        border-radius: 50px;
    }
    /* แบบ 3 : กำหนดมุมที่ต้องการโค้ง */
    .radius-top{
        border-radius: 30px 30px 0 0;
    }
    /* แบบ 4 : วงกลมเต็ม (ถ้ากว้าง  = สูง) */
    .circle{
        width: 120px;
        height: 120px;
        background-color: blanchedalmond;
        border-radius: 50%;
    }
</style>
<body>
    <h1>ตัวอย่าง ของ Border</h1>
    <h2>แบบที่ 1 : โค้งทุกมุมเท่ากัน</h2>
    <div class="border-list radius-20">
        20px.
    </div>
</body>
</html>
