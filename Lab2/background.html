<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box-color {
            width: 200px;
            height: 200px;
            background-color: lightblue;
            border: 2px solid #000;
        }

        .box-image {
            width: 200px;
            height: 200px;
            background-image: url('https://www.reddit.com/r/deathnote/comments/1btbt0g/l_lawliet_by_muksal/?tl=th');
            background-size: cover;
            border: 2px solid #000;
        }

        .box-short{
            width: 200px;
            height: 100px;
            background-color: lightgreen;
            border: 2px solid #000;
        }
    </style>
</head>
<body>
    <p>กล่องที่มีสีพื้นหลัง</p>
    <div class="box-color"></div>
    <p>กล่องที่มีภาพพื้นหลัง</p>
    <div class="box-image"></div>
    <p>กล่องที่มีความสูงน้อยกว่า</p>
    <div class="box-short"></div>
</body>
</html>
