<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Grade Check</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            padding: 20px;
        }

        button {
            background: #2bb3d6;
            color: white;       
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #output {
            margin-top: 15px;
            background: #000;
            color: #fff;
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid #00ff88;
            width: 300px;
        }
    </style>
</head>
<body>

    <button onclick="runCode()">Run Code</button>

    <div id="output"></div>

    <script>
        function runCode() {

            // ประกาศตัวแปรคะแนน
            let score = 50;

            let grade = "";
            let result = "";

            // ตัดเกรด
            if (score >= 80) {
                grade = "A";
            } else if (score >= 70) {
                grade = "B";
            } else if (score >= 60) {
                grade = "C";
            } else if (score >= 50) {
                grade = "D";
            } else {
                grade = "F";
            }

            // ตรวจสอบผ่าน / ไม่ผ่าน
            if (score >= 50) {
                result = "ผ่าน";
            } else {
                result = "ไม่ผ่าน";
            }

            // Console
            console.log("คะแนนที่สุ่มได้: " + score);
            console.log("เกรด: " + grade);
            console.log("ผลสอบ: " + result);

            // แสดงผล
            document.getElementById("output").innerHTML =
                "คะแนนที่สุ่มได้: " + score + "<br>" +
                "เกรด: " + grade + "<br>" +
                "ผลสอบ: " + result;
        }
    </script>

</body>
</html>
