<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>การตรวจสอบเกรด (Switch Statement)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 30px;
        }
        h1 {
            margin-bottom: 20px;
        }
        button {
            background: orange;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: darkorange;
        }
        #outputBox {
            margin-top: 20px;
            background: #111;
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            width: 300px;
            border: 3px solid orange;
        }
    </style>
</head>
<body>

<h1>การตรวจสอบเกรด (Switch Statement)</h1>
<button onclick="runProgram()">Run Code</button>

<div id="outputBox">กด Run Code เพื่อเริ่ม</div>

<script>
function runProgram() {

    // 1. สุ่มคะแนน 0–100
    let score = Math.floor(Math.random() * 101);

    // 2. ตัดเกรดด้วย if/else
    let grade = "";
    if (score >= 80) {
        grade = "A";
    } else if (score >= 70) {
        grade = "B";
    } else if (score >= 60) {
        grade = "C";
    } else if (score >= 50) {
        grade = "D";
    } else {
        grade = "F";
    }

    // 3. ผลสอบ
    let result = (grade === "F") ? "ไม่ผ่าน" : "ผ่าน";

    // 4. Switch Statement สำหรับคำอธิบาย
    let description = "";

    switch (grade) {
        case "A":
            description = "ยอดเยี่ยมมาก";
            break;
        case "B":
            description = "ดีมาก รักษามาตรฐานไว้";
            break;
        case "C":
            description = "ผ่านเกณฑ์ระดับดี";
            break;
        case "D":
            description = "พอใช้ แต่ควรพัฒนาเพิ่ม";
            break;
        case "F":
            description = "ต้องลงทะเบียนเรียนใหม่";
            break;
        default:
            description = "ไม่มีข้อมูล";
    }

    // 5. แสดงผลหน้าเว็บ
    let outputText = `
คะแนนที่สุ่มได้: ${score}<br>
เกรด: ${grade}<br>
ผลสอบ: ${result}<br>
คำอธิบาย: ${description}
    `;

    document.getElementById("outputBox").innerHTML = outputText;

    // 6. แสดงผล Console
    console.log("คะแนน:", score);
    console.log("เกรด:", grade);
    console.log("ผลสอบ:", result);
    console.log("คำอธิบาย:", description);
}
</script>

</body>
</html>
